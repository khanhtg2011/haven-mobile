<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Haven Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px) 24px;
      overflow: hidden;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #33334d;
      border-top-color: #6b4fdb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    p { font-size: 14px; color: #999; text-align: center; max-width: 280px; }
    .err-btn {
      margin-top: 24px;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      background: #6b4fdb;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h2 id="status-title">Đang kết nối Haven...</h2>
  <p id="status-desc">Đang tải máy chủ https://haven.khanhs.io.vn</p>
  <button class="err-btn" id="retry-btn" onclick="connect()">Thử lại</button>

  <script>
    const TARGET = "https://haven.khanhs.io.vn";
    let timeoutId = null;
    function connect() {
      if (timeoutId !== null) {
        clearTimeout(timeoutId);
      }
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status-title').textContent = 'Đang kết nối Haven...';
      document.getElementById('status-desc').textContent = 'Đang tải máy chủ ' + TARGET;
      document.getElementById('retry-btn').style.display = 'none';

      timeoutId = setTimeout(() => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status-title').textContent = 'Chưa tải được máy chủ';
        document.getElementById('status-desc').textContent = 'Kiểm tra kết nối mạng hoặc thử lại.';
        document.getElementById('retry-btn').style.display = 'inline-block';
      }, 10000);

      window.location.replace(TARGET);
    }

    window.addEventListener('pagehide', () => {
      if (timeoutId !== null) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
    });

    // Connect immediately
    connect();
  </script>
</body>
</html>
