[package]
name = "haven-desktop"
version = "2.0.0-alpha.1"
description = "Haven Desktop: Ultra-lightweight Rust & Tauri v2 Client"
authors = ["Haven Contributors <ancsemi@haven-app.com>"]
license = "AGPL-3.0"
repository = "https://github.com/khanhtg2011/haven-mobile"
edition = "2021"

[lib]
name = "haven_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
